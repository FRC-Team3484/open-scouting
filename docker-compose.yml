version: "3.8"
services:
  postgres:
    image: postgres:16
    expose:
      - "5432"
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    volumes:
      - /mnt/openscouting_db/postgres:/var/lib/postgresql/data

  frontend:
    image: ghcr.io/frc-team3484/open-scouting-frontend:latest
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: production
    env_file:
      - .env

  backend:
    image: ghcr.io/frc-team3484/open-scouting-backend:latest
    restart: unless-stopped
    expose:
      - "8000"
    env_file:
      - .env
    depends_on:
      - postgres
    volumes:
      - /mnt/openscouting_db/uploads:/data/uploads

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - /mnt/openscouting_db/uploads:/data/uploads:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

  backup:
    image: docker.io/nfrastack/db-backup
    restart: unless-stopped
    depends_on:
      - postgres

    volumes:
      - /mnt/openscouting_db/backups:/backup

    environment:
      TIMEZONE: America/New_York

      BACKUP_JOB_CONCURRENCY: 1

      DEFAULT_BACKUP_INTERVAL: 1440
      DEFAULT_BACKUP_BEGIN: 0300
      DEFAULT_CLEANUP_TIME: 20160 # 14 days

      DEFAULT_COMPRESSION: ZSTD
      DEFAULT_CHECKSUM: NONE

      DB01_TYPE: postgres
      DB01_HOST: postgres
      DB01_NAME: app
      DB01_USER: app
      DB01_PASS: app

volumes:
  caddy_data:
  caddy_config: